name: PartsVision candidate models

# Exports open-source candidate models for offline comparison on real photos.
on:
  push:
    paths: ["PartsVision/tools/export_candidates.py", ".github/workflows/partsvision-candidates.yml"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        which: [embedders, proposers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40" ultralytics onnx onnxslim onnxruntime numpy
      - name: Export
        working-directory: PartsVision/tools
        run: python export_candidates.py ${{ matrix.which }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-candidates-v1
          name: PartsVision candidate models (evaluation only)
          prerelease: true
          body: Candidate models for comparison; the app does not use these.
          files: |
            PartsVision/tools/*_int8.onnx
            PartsVision/tools/yoloe*.onnx
