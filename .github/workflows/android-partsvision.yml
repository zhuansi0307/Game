name: PartsVision Android build

on:
  push:
    paths: ["PartsVision/**", ".github/workflows/android-partsvision.yml"]
  pull_request:
    paths: ["PartsVision/**", ".github/workflows/android-partsvision.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PartsVision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PartsVision-debug-apk
          path: PartsVision/app/build/outputs/apk/debug/*.apk
