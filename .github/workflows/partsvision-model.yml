name: PartsVision embedding model

# Converts DINOv2-small to ONNX and publishes it as a release asset that the app build downloads.
on:
  push:
    paths: ["PartsVision/tools/export_dinov2.py", ".github/workflows/partsvision-model.yml"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40" onnx onnxruntime numpy
      - name: Export
        working-directory: PartsVision/tools
        run: python export_dinov2.py
      # Must load in the ONNX Runtime version the app ships (app/build.gradle.kts).
      - name: Check with the app's ONNX Runtime
        working-directory: PartsVision/tools
        run: |
          python -m venv /tmp/ort-app && /tmp/ort-app/bin/pip install -q onnxruntime==1.20.1 numpy
          /tmp/ort-app/bin/python -c "import onnxruntime as o; s = o.InferenceSession('dinov2_small_int8.onnx'); print('loads in', o.__version__, [(x.name, x.shape) for x in s.get_outputs()])"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-dinov2s-v3
          name: PartsVision embedding model (DINOv2-small)
          prerelease: true
          body: On-device image embedding model used by the PartsVision app build.
          files: |
            PartsVision/tools/dinov2_small_int8.onnx
            PartsVision/tools/dinov2_small_fp32.onnx
